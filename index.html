
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Beam AI">
<link rel="icon" type="image/png" href="./beamlogo1.png">
<link rel="stylesheet" href="./style.css">
<title>Beam</title>

<style>
.model-selector{
    position:relative;
}

.model-selector-button{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    border:1px solid rgba(255,255,255,.075);
    border-radius:10px;
    color:#f3f5f8;
    background:rgba(255,255,255,.025);
    cursor:pointer;
    text-align:left;
}

.model-selector-button:hover{
    background:rgba(255,255,255,.055);
}

.model-selector-button .model-card-logo{
    flex-shrink:0;
}

.model-selector-info{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.model-selector-info strong{
    font-size:12px;
}

.model-selector-info span{
    color:#42d97b;
    font-size:10px;
}

.model-selector-arrow{
    margin-left:auto;
    color:#8e96a5;
}

.model-menu{
    position:absolute;
    left:0;
    right:0;
    bottom:calc(100% + 7px);
    padding:5px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:#11151d;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    z-index:100;
}

.model-menu.hidden{
    display:none;
}

.model-option{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px;
    border-radius:7px;
    color:#f3f5f8;
    background:transparent;
    cursor:pointer;
    text-align:left;
}

.model-option:hover{
    background:rgba(255,255,255,.055);
}

.model-option-main{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.model-option-main strong{
    font-size:12px;
}

.model-option-main span{
    color:#8e96a5;
    font-size:10px;
}

.model-option-check{
    color:#42d97b;
    opacity:0;
}

.model-option.active .model-option-check{
    opacity:1;
}

.mobile-model-selector{
    display:none;
}

@media(max-width:800px){
    .mobile-model-selector{
        display:block;
    }

    .mobile-model-selector button{
        display:flex;
        align-items:center;
        gap:5px;
        padding:6px 9px;
        border-radius:8px;
        color:#f3f5f8;
        background:rgba(255,255,255,.05);
        cursor:pointer;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="sidebar-top">

<div class="brand">
<div class="brand-logo">
<img src="./beamlogo1.png" alt="Beam">
</div>

<div class="brand-text">
<strong>Beam</strong>
<span>AI assistant</span>
</div>
</div>

<button class="new-chat" id="newChatButton">
<span class="new-chat-icon">＋</span>
<span>New chat</span>
<span class="new-chat-key">N</span>
</button>

<div class="sidebar-search">
<span>⌕</span>
<input id="chatSearch" type="text" placeholder="Search chats">
</div>

<div class="sidebar-nav">

<button class="nav-button active" data-view="chats">
<span>▤</span>
<span>Chats</span>
</button>

<button class="nav-button" data-view="recents">
<span>◷</span>
<span>Recents</span>
</button>

</div>
</div>

<div class="conversation-area">

<div class="conversation-heading">
<span id="conversationHeading">Today</span>
<span id="conversationCount">0</span>
</div>

<div id="conversationList" class="conversation-list"></div>

<div id="emptyConversations" class="empty-conversations">
<div class="empty-icon">◌</div>
<span>No conversations yet</span>
</div>

</div>

<div class="sidebar-bottom">

<div class="model-selector">

<button class="model-selector-button" id="modelSelector" type="button">

<div class="model-card-logo">
<img src="./beamlogo1.png" alt="Beam">
</div>

<div class="model-selector-info">
<strong id="selectedModelName">Beam 1</strong>
<span>Online</span>
</div>

<span class="model-selector-arrow">⌃</span>

</button>

<div class="model-menu hidden" id="modelMenu">

<button class="model-option active" data-model="beam-1">

<span class="model-option-main">
<strong>Beam 1</strong>
<span>Beam's main model</span>
</span>

<span class="model-option-check">✓</span>

</button>

<button class="model-option" data-model="beam-o2">

<span class="model-option-main">
<strong>Beam o2</strong>
<span>Beam's o2 model</span>
</span>

<span class="model-option-check">✓</span>

</button>

</div>
</div>

<div class="sidebar-links">

<button id="modelInfoButton">Model info</button>
<button id="policyButton">Policy</button>

</div>

</div>

</aside>

<main class="main">

<header class="topbar">

<div class="topbar-left">

<button class="mobile-menu" id="mobileMenu">☰</button>

<div class="mobile-brand">
<img src="./beamlogo1.png" alt="Beam">
<span>Beam</span>
</div>

<div class="model-title">

<strong id="topModelName">Beam 1</strong>

<span class="status-pill">
<span class="status-dot"></span>
Online
</span>

</div>

<div class="mobile-model-selector">

<button id="mobileModelButton" type="button">
<span id="mobileModelName">Beam 1</span>
<span>⌃</span>
</button>

</div>

</div>

<div class="topbar-actions">

<button class="topbar-button" id="exportButton" title="Export conversation">
⇩
</button>

<button class="topbar-button" id="clearButton" title="Clear conversation">
⌫
</button>

</div>

</header>

<section class="chat-shell">

<div id="chatArea" class="chat-area"></div>

<div class="scroll-bottom" id="scrollBottom">
↓
</div>

</section>

<footer class="composer-wrap">

<div class="composer">

<textarea
id="messageInput"
rows="1"
maxlength="12000"
placeholder="Message Beam..."
></textarea>

<button id="sendButton" class="send-button" disabled>
<span>↑</span>
</button>

</div>

<div class="composer-footer">

<span>
Beam can make mistakes. Check important information.
</span>

<span>
Enter to send · Shift + Enter for new line
</span>

</div>

</footer>

</main>

</div>

<div class="modal hidden" id="modal">

<div class="modal-backdrop"></div>

<div class="modal-card">

<button class="modal-close" id="modalClose">
×
</button>

<div id="modalContent"></div>

</div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script src="./app.js"></script>

</body>
</html>
