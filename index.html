
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b10">
    <meta name="description" content="Beam AI">
    <link rel="icon" type="image/png" href="./beamlogo1.png">
    <link rel="stylesheet" href="./style.css">
    <title>Beam</title>
</head>
<body>
<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-logo">
                    <img src="./beamlogo1.png" alt="Beam">
                </div>
                <div class="brand-text">
                    <strong>Beam</strong>
                    <span>AI assistant</span>
                </div>
            </div>

            <button class="new-chat" id="newChatButton">
                <span class="new-chat-icon">＋</span>
                <span>New chat</span>
                <span class="new-chat-key">N</span>
            </button>

            <div class="sidebar-search">
                <span>⌕</span>
                <input id="chatSearch" type="text" placeholder="Search chats">
            </div>

            <div class="sidebar-nav">
                <button class="nav-button active" data-view="chats">
                    <span>▤</span>
                    <span>Chats</span>
                </button>
                <button class="nav-button" data-view="recents">
                    <span>◷</span>
                    <span>Recents</span>
                </button>
            </div>
        </div>

        <div class="conversation-area">
            <div class="conversation-heading">
                <span id="conversationHeading">Today</span>
                <span id="conversationCount">0</span>
            </div>

            <div id="conversationList" class="conversation-list"></div>

            <div id="emptyConversations" class="empty-conversations">
                <div class="empty-icon">◌</div>
                <span>No conversations yet</span>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="model-selector">
                <button class="model-card" id="modelSelector" type="button">
                    <div class="model-card-logo">
                        <img src="./beamlogo1.png" alt="Beam">
                    </div>
                    <div class="model-card-info">
                        <strong id="selectedModelName">Beam 1</strong>
                        <span>Online</span>
                    </div>
                    <span class="online-dot"></span>
                    <span class="model-chevron">⌄</span>
                </button>

                <div class="model-menu hidden" id="modelMenu">
                    <button class="model-option active" data-model="beam-1">
                        <span>
                            <strong>Beam 1</strong>
                            <small>Beam's main model</small>
                        </span>
                        <span class="model-check">✓</span>
                    </button>

                    <button class="model-option" data-model="beam-o2">
                        <span>
                            <strong>Beam o2</strong>
                            <small>Beam's lightweight model</small>
                        </span>
                        <span class="model-check">✓</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-links">
                <button id="modelInfoButton">Model info</button>
                <button id="policyButton">Policy</button>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu" id="mobileMenu">☰</button>

                <div class="mobile-brand">
                    <img src="./beamlogo1.png" alt="Beam">
                    <span>Beam</span>
                </div>

                <button class="mobile-model" id="mobileModelButton" type="button">
                    <span id="mobileModelName">Beam 1</span>
                    <span>⌄</span>
                </button>

                <div class="model-title">
                    <strong id="topModelName">Beam 1</strong>
                    <span class="status-pill">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>
            </div>

            <div class="topbar-actions">
                <button class="topbar-button" id="exportButton" title="Export conversation">⇩</button>
                <button class="topbar-button" id="clearButton" title="Clear conversation">⌫</button>
            </div>
        </header>

        <section class="chat-shell">
            <div id="chatArea" class="chat-area"></div>
            <div class="scroll-bottom" id="scrollBottom">↓</div>
        </section>

        <footer class="composer-wrap">
            <div class="composer">
                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="12000"
                    placeholder="Message Beam..."
                ></textarea>

                <button id="sendButton" class="send-button" disabled>
                    <span>↑</span>
                </button>
            </div>

            <div class="composer-footer">
                <span>Beam can make mistakes. Check important information.</span>
                <span>Enter to send · Shift + Enter for new line</span>
            </div>
        </footer>
    </main>
</div>

<div class="modal hidden" id="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
        <button class="modal-close" id="modalClose">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="./app.js"></script>
</body>
</html>
