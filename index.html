
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="brand-icon">B</div>
                    <div>
                        <div class="brand-name">Beam</div>
                        <div class="brand-subtitle">Local AI</div>
                    </div>
                </div>

                <button class="new-chat" id="newChat">
                    <span>＋</span>
                    <span>New chat</span>
                </button>
            </div>

            <div class="conversation-list" id="conversationList"></div>

            <div class="sidebar-bottom">
                <div class="model-selector" id="modelSelector">
                    <div class="model-selector-main">
                        <div class="model-icon">✦</div>

                        <div class="model-info">
                            <div class="model-name" id="sidebarModelName">Beam 1</div>
                            <div class="model-status" id="sidebarModelStatus">
                                8B · Main / GPU
                            </div>
                        </div>

                        <div class="model-chevron">⌄</div>
                    </div>

                    <div class="model-menu" id="modelMenu">
                        <button class="model-option active" data-model="beam-1">
                            <div class="option-icon">✦</div>
                            <div class="option-info">
                                <div class="option-name">Beam 1</div>
                                <div class="option-description">8B · Main / GPU</div>
                            </div>
                            <div class="option-check">✓</div>
                        </button>

                        <button class="model-option" data-model="beam-o2">
                            <div class="option-icon">◈</div>
                            <div class="option-info">
                                <div class="option-name">Beam o2</div>
                                <div class="option-description">1.5B · Lightweight / CPU</div>
                            </div>
                            <div class="option-check">✓</div>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">

            <header class="topbar">
                <button class="menu-button" id="menuButton">☰</button>

                <div class="topbar-model">
                    <span class="topbar-model-icon">✦</span>
                    <span id="topbarModelName">Beam 1</span>
                </div>

                <button class="mobile-model-button" id="mobileModelButton">
                    ✦
                </button>
            </header>

            <section class="chat" id="chat">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">✦</div>
                    <h1>How can I help?</h1>
                    <p>Beam is ready.</p>
                </div>
            </section>

            <div class="composer-area">
                <div class="composer">
                    <textarea
                        id="messageInput"
                        placeholder="Message Beam..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button class="send-button" id="sendButton" disabled>
                        ↑
                    </button>
                </div>

                <div class="composer-note">
                    Beam can make mistakes. Check important information.
                </div>
            </div>
        </main>
    </div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">×</button>

            <div class="modal-icon">✦</div>
            <h2 id="modalTitle">Beam 1</h2>
            <p id="modalDescription">
                Qwen3-8B · 4-bit NF4 · GPU/RAM offload
            </p>

            <button class="modal-done" id="modalDone">
                Done
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
