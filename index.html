<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Beam AI">
<link rel="icon" type="image/png" href="./BeamLogo.png">
<link rel="stylesheet" href="./style.css">
<title>Beam</title>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="sidebar-top">

<div class="brand">
<div class="brand-logo">
<img src="./BeamLogo.png" alt="Beam">
</div>
<button class="sidebar-collapse-btn" id="collapseButton" title="Collapse sidebar">⟨</button>
</div>

<button class="new-chat" id="newChatButton">
<span class="new-chat-icon">＋</span>
<span>New chat</span>
<span class="new-chat-key">N</span>
</button>

<div class="sidebar-search">
<span>⌕</span>
<input id="chatSearch" type="text" placeholder="Search chats">
</div>

<div class="sidebar-nav">
<button class="nav-button active" data-view="chats">
<span>▤</span>
<span>Chats</span>
</button>
<button class="nav-button" data-view="recents">
<span>◷</span>
<span>Recents</span>
</button>
</div>

</div>

<div class="conversation-area">
<div class="conversation-heading">
<span id="conversationHeading">Today</span>
<span id="conversationCount">0</span>
</div>
<div id="conversationList" class="conversation-list"></div>
<div id="emptyConversations" class="empty-conversations">
<div class="empty-icon">◌</div>
<span>No conversations yet</span>
</div>
</div>

<div class="sidebar-bottom">

<div class="auth-box">

<div class="auth-signed-out" id="authSignedOut">
<button id="openLoginBtn">Log in</button>
<button id="openSignupBtn">Sign up</button>
</div>

<div class="auth-signed-in" id="authSignedIn">
<span class="auth-email" id="authEmail"></span>
<button id="logoutBtn">Log out</button>
</div>

</div>

<div class="model-selector">

<button class="model-selector-button" id="modelSelector" type="button">
<div class="model-card-logo">
<img src="./BeamLogo.png" alt="Beam">
</div>
<div class="model-selector-info">
<strong id="selectedModelName">Beam 1</strong>
<span>Online</span>
</div>
<span class="model-selector-arrow">⌃</span>
</button>

<div class="model-menu hidden" id="modelMenu">
<button class="model-option active" data-model="beam-1">
<span class="model-option-main">
<strong>Beam 1</strong>
<span>Daily use, light coding, and talking</span>
</span>
<span class="model-option-check">✓</span>
</button>
<button class="model-option" data-model="beam-1-fol">
<span class="model-option-main">
<strong>Beam 1 Fol</strong>
<span>Stronger coding and conversation, better than Beam 1</span>
</span>
<span class="model-option-check">✓</span>
</button>
<button class="model-option" data-model="beam-o2">
<span class="model-option-main">
<strong>Beam o2</strong>
<span>Mini model, lighter usage, made for talking</span>
</span>
<span class="model-option-check">✓</span>
</button>
<button class="model-option" data-model="o1-flash">
<span class="model-option-main">
<strong>O1 Flash</strong>
<span>Fast and light — works without logging in</span>
</span>
<span class="model-option-check">✓</span>
</button>
</div>
</div>

<div class="sidebar-links">
<button id="modelInfoButton">Model info</button>
<button id="policyButton">Policy</button>
<button id="themeButton">Theme</button>
</div>

</div>

</aside>

<main class="main">

<header class="topbar">
<div class="topbar-left">
<button class="mobile-menu" id="mobileMenu">☰</button>
<div class="mobile-brand">
<img src="./BeamLogo.png" alt="Beam">
<span>Beam</span>
</div>
<div class="model-title">
<strong id="topModelName">Beam 1</strong>
<span class="status-pill">
<span class="status-dot"></span>
Online
</span>
</div>
<div class="mobile-model-selector">
<button id="mobileModelButton" type="button">
<span id="mobileModelName">Beam 1</span>
<span>⌃</span>
</button>
</div>
</div>

<div class="topbar-actions">
<button class="topbar-button" id="exportButton" title="Export conversation">⇩</button>
<button class="topbar-button" id="clearButton" title="Clear conversation">⌫</button>
</div>
</header>

<section class="chat-shell">
<div id="chatArea" class="chat-area"></div>
<div class="scroll-bottom" id="scrollBottom">↓</div>
</section>

<footer class="composer-wrap">
<div class="composer">
<textarea id="messageInput" rows="1" maxlength="12000" placeholder="Message Beam..."></textarea>
<button id="sendButton" class="send-button" disabled><span>↑</span></button>
</div>
<div class="composer-footer">
<span>Beam can make mistakes. Check important information.</span>
<span>Enter to send · Shift + Enter for new line</span>
</div>
</footer>

</main>

</div>

<div class="modal hidden" id="modal">
<div class="modal-backdrop"></div>
<div class="modal-card">
<button class="modal-close" id="modalClose">×</button>
<div id="modalContent"></div>
</div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="./app.js"></script>

</body>
</html>
